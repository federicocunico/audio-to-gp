[project]
name = "audio-to-gp-worker"
version = "0.1.0"
description = "Headless worker: MP3 → stems (demucs) → MIDI (basic-pitch)"
requires-python = ">=3.10, <3.12"
dependencies = [
    "demucs",
    "basic-pitch[onnx]",
    "torch>=2.1,<2.4",
    "torchaudio>=2.1,<2.4",
    "soundfile>=0.12",
]

[tool.uv]
override-dependencies = [
    "tensorflow-io-gcs-filesystem; sys_platform != 'win32'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "platform_system == 'Windows' or platform_system == 'Linux'" },
]
torchaudio = [
    { index = "pytorch-cu121", marker = "platform_system == 'Windows' or platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  build-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package artifacts
        shell: pwsh
        run: |
          $dest = "audio-to-gp-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $dest

      - name: Upload Windows artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: audio-to-gp-windows-${{ github.ref_name }}.zip

  build-macos:
    needs: create-release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Generate macOS platform files
        run: flutter create --platforms=macos .

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package artifacts
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/audio-to-gp-macos-${{ github.ref_name }}.zip" *.app

      - name: Upload macOS artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: audio-to-gp-macos-${{ github.ref_name }}.zip
